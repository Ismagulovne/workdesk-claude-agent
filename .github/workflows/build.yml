name: Сборка агента WorkDesk+Claude

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Зависимости
        run: go mod tidy
      - name: Тесты
        run: go vet ./... && go test -v ./...
        shell: bash

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Сборка под все платформы
        run: |
          go mod tidy
          VER="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF_TYPE" == tag ]] || VER="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [[ $os == windows ]] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VER" \
              -o "dist/workdesk-claude-$VER-$os-$arch$ext" .
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: workdesk-claude
          path: dist/*
      - name: Релиз
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "WorkDesk+Claude агент $GITHUB_REF_NAME" --notes "Сборки для Windows, Linux и macOS (amd64, arm64)."
